services:

  postgres:
    container_name: auth-postgres
    image: postgres:16
    restart: always
    tty: true
    env_file:
      - ./.env.production.local
    expose:
      - "5433"
    ports:
      - "5433:5433"
    volumes:
      - ./backups:/home/postgres
      - ./postgres:/var/lib/postgresql/data
    command: -p 5433
    networks:
      - node-network

  frontend:
    container_name: auth-frontend
    platform: linux/x86_64
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - ./.env.production.local
#    image: mbaluev/next-auth-v5:latest
    networks:
      - node-network
    ports:
      - "3000:3000"

  nginx:
    container_name: auth-nginx
    build:
      context: nginx
    restart: always
    tty: true
    ports:
      - "80:80"
    networks:
      - node-network
    depends_on:
      - frontend
      - postgres

networks:
  node-network:
    driver: bridge
